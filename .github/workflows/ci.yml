name: CI Pipeline

on: [push]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mqtt:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_pub -h localhost -t test -m ping -q 0 2>/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npx jest tests/home.test.js

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v3

      - name: Build backend Docker image
        run: docker build -t bodaboda-backend:latest ./backend

      - name: Build frontend Docker image
        run: docker build -t bodaboda-frontend:latest ./frontend

      - name: Start MQTT broker
        run: |
          docker run -d --name bodaboda-mqtt -p 1883:1883 eclipse-mosquitto:latest
          sleep 3

      - name: Verify MQTT broker is running
        run: docker ps | grep bodaboda-mqtt