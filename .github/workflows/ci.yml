# CI Pipeline — Continuous Integration
# Triggered automatically on every code push to the repository

name: CI Pipeline

on: [push]  # Runs on every push to any branch

jobs:

  # ─── JOB 1: BACKEND TESTS ───
  test-backend:
    runs-on: ubuntu-latest
    services:
      mqtt:
        image: eclipse-mosquitto:latest
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_pub -h localhost -t test -m ping -q 0 2>/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # IMPROVEMENT: Run tests WITH coverage reporting
      # Shows what percentage of code is actually tested
      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest tests/ --cov=. --cov-report=term-missing --cov-report=html

      # Upload coverage report as a downloadable artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  # ─── JOB 2: FRONTEND TESTS ───
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npx jest tests/home.test.js

  # ─── JOB 3: BUILD & PUSH TO DOCKER HUB ───
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            novertto/bodaboda-backend:latest
            novertto/bodaboda-backend:v1.0

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            novertto/bodaboda-frontend:latest
            novertto/bodaboda-frontend:v1.0

  # ─── JOB 4: NOTIFICATION (IMPROVEMENT) ───
  # Sends an email after every pipeline run, success or failure
  # Closes the root cause found in Task 3: no alert when pipeline finishes/fails
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()  # Run even if previous jobs failed
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Bodda-Fasta CI Pipeline: ${{ needs.build-and-push.result }}"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: Bodda-Fasta CI
          body: "Pipeline run finished with status ${{ needs.build-and-push.result }}. View details: https://github.com/nwillbrightn/Bodda-Fasta/actions"